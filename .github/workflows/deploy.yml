name: Deploy medsync-front-legacy to Contabo prod

on:
  workflow_dispatch:

env:
  VPS_HOST: 195.26.247.210
  # Toolchain antiguo: vue-cli 4.5 usa webpack 4. En Node 17+ hace falta
  # --openssl-legacy-provider para compilar (se fuerza en el paso de build).
  NODE_VERSION: 22
  APP_NAME: medsync-front-legacy
  APP_PORT: 4324
  DEPLOY_RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          CONFIGURED_APP_PORT: ${{ secrets.APP_PORT }}
          VUE_APP_CORE_URL_API: ${{ secrets.VUE_APP_CORE_URL_API }}
          VUE_APP_AUTH_COOKIE_MODE: ${{ secrets.VUE_APP_AUTH_COOKIE_MODE }}
          VUE_APP_BROWSER_AUTH_TRANSPORT: ${{ secrets.VUE_APP_BROWSER_AUTH_TRANSPORT }}
          VUE_APP_CSRF_ENABLED: ${{ secrets.VUE_APP_CSRF_ENABLED }}
        run: |
          node <<'NODE'
          require('./scripts/ops/verify-frontend.cjs').assertPort(process.env.CONFIGURED_APP_PORT);
          const required = ['VPS_HOST', 'VPS_FINGERPRINT', 'VPS_USER', 'VPS_SSH_KEY', 'VPS_APP_DIR', 'VUE_APP_CORE_URL_API', 'VUE_APP_AUTH_COOKIE_MODE', 'VUE_APP_BROWSER_AUTH_TRANSPORT', 'VUE_APP_CSRF_ENABLED'];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length > 0) {
            console.error(`Missing GitHub secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          const expected = { VUE_APP_AUTH_COOKIE_MODE: 'd2', VUE_APP_BROWSER_AUTH_TRANSPORT: 'cookie', VUE_APP_CSRF_ENABLED: 'true' };
          if (Object.keys(expected).some(key => String(process.env[key]).trim().toLowerCase() !== expected[key])) {
            console.error('Production requires d2 / cookie / true authentication configuration.');
            process.exit(1);
          }
          NODE

      - name: Test deployment verification
        run: node --test scripts/qa/frontend-deploy-health.test.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          # `npm run build` aplica --openssl-legacy-provider vía cross-env
          # (multiplataforma) y dispara el prebuild, que valida que
          # VUE_APP_CORE_URL_API sea https:// antes de compilar.
          VUE_APP_CORE_URL_API: ${{ secrets.VUE_APP_CORE_URL_API }}
          # Config de auth D2 (cookie + CSRF). Vienen de secrets para poder
          # ajustarlas por entorno sin tocar el código.
          VUE_APP_AUTH_COOKIE_MODE: ${{ secrets.VUE_APP_AUTH_COOKIE_MODE }}
          VUE_APP_BROWSER_AUTH_TRANSPORT: ${{ secrets.VUE_APP_BROWSER_AUTH_TRANSPORT }}
          VUE_APP_CSRF_ENABLED: ${{ secrets.VUE_APP_CSRF_ENABLED }}
        run: |
          npm run build
          node scripts/ops/verify-frontend.cjs seal

      - name: Prepare app directory on VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ env.VPS_HOST }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          envs: VPS_APP_DIR
          script: |
            set -e
            mkdir -p "$VPS_APP_DIR"
            rm -rf "$VPS_APP_DIR/dist"

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          source: "dist,scripts/ops/verify-frontend.cjs"
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Serve with pm2
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          NODE_VERSION: ${{ env.NODE_VERSION }}
          APP_NAME: ${{ env.APP_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          DEPLOY_RELEASE: ${{ env.DEPLOY_RELEASE }}
        with:
          host: ${{ env.VPS_HOST }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          envs: VPS_APP_DIR,NODE_VERSION,APP_NAME,APP_PORT,DEPLOY_RELEASE
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install "$NODE_VERSION"
            nvm use "$NODE_VERSION"

            cd "$VPS_APP_DIR"

            command -v pm2 > /dev/null || npm install --global pm2

            # Recreate only this app so an old PM2 port/path cannot survive reload.
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 delete "$APP_NAME"
            fi
            PM2_SERVE_PORT="$APP_PORT" PM2_SERVE_PATH="$VPS_APP_DIR/dist" \
              pm2 serve "$VPS_APP_DIR/dist" "$APP_PORT" --spa --name "$APP_NAME"
            if node scripts/ops/verify-frontend.cjs verify; then
              pm2 save
            else
              pm2 status
              pm2 logs "$APP_NAME" --lines 40 --nostream
              exit 1
            fi
